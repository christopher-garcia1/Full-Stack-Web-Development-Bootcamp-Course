<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Grid - Rows and 12 Columns</title>
    <!-- Include Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Bootstrap Grid & Breakpoints</h1>
    <div class="container-fluid"> 
      <div class="row bg-success p-2">
        <!-- Column 1 -->
         <div class="col-12 col-sm-6 col-md-4 col-lg">
          <div class="border bg-primary text-white p-3">
                <div class="row text-center"> 
                  <div class="col  bg-black">col</div> 
                  <div class="col">col</div>             
                </div>
              </div> 
         </div> 
         <!-- Column 2 --> 
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="p-3 border bg-danger text-white">
              <div class="row text-center">
                <div class="col">
                  hi
                </div>
                <div class="col">
                  hi
                </div>
                <div class="col">
                  hi
                </div>
              </div>
          </div>
         </div> 
        <!-- Column 3 -->
         <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="p-3 border bg-info text-white text-center">
              c3
          </div>
         </div> 
         <!-- Column 4 --> 
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="p-3 border bg-light text-dark text text-center">
              c4
          </div>
         </div> 
      </div>
    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
