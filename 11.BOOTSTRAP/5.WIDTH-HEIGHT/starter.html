<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Sizing Utilities</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h2>Width Utilities</h2>
    <!-- Width Utilities (Relative to parents)-->
    <div>
      <div class="bg-success my-3 w-25 p-3">Width 25%</div>
      <div class="bg-danger my-3 w-50 p-3">Width 50%</div>
      <div class="bg-warning my-3 w-75 p-3">Width 75%</div>
      <div class="bg-info my-3 w-100 p-3">Width 100%</div>
      <div class="bg-success my-3 w-auto p-3">Width auto</div>
    </div>

    <h2>Height Utilities</h2>
    <!-- Height Utilities (Relative to parents)-->
    <div style="height: 500px;" class="bg-dark">
      <div class="bg-success  h-25 p-3 d-inline-block">Height 25%</div>
      <div class="bg-danger  h-50 p-3 d-inline-block">Height 50%</div>
      <div class="bg-info h-75 p-3 d-inline-block">Height 75%</div>
      <div class="bg-warning  h-100 p-3 d-inline-block">Height 100%</div>
      <div class="bg-success h-auto p-3 d-inline-block">Height auto</div>
    </div>

    <h2>Viewport Relative Sizes</h2>
    <!-- Relative to the viewport -->
    <div class="min-vw-100 bg-danger">Min-width 100vw</div>
    <div class="min-vh-100 bg-info">Min-height 100vh</div>
    <div class="vw-100 bg-danger text-white">Width 100vw</div>
    <div class="vh-100 bg-info text-white">Height 100vh</div> 
    <div class="item bg-light">hello</div>
  </body>
</html>
