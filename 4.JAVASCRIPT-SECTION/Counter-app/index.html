<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center title">Counter App</h1> 
    <h3 class="text-center counter">0</h3>
    <div class="container">
        <div class="row justify-content-center">
            <div class="btn col-md-2 btn-success m-1 btn1 align-content-center"> Increase</div> 
            <div class="btn col-md-2 btn-danger m-1 btn2 align-content-center"> Decrease </div>
            <div class="btn col-md-2 btn-warning m-1 btn3 align-content-center"> Increase by 10</div>
            <div class="btn col-md-2 btn-light m-1 btn4 align-content-center"> reset</div>


        </div>
    </div>
    <script src="script.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
