<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Generator </title>
    <style>
        .profile-card{
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            max-width: 300px;
            text-align: center;  
            margin: 20px;
        } 

        img{
            width: 100px;
            height: 100px;
            border-radius: 100%;
            object-fit: cover;
        } 

        #app{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body> 
    <div id="app"></div>
    <button id="generateBtn">generate new profile</button>
    <script src="script.js"></script>
</body>
</html>
